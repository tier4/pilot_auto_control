autoware_system_design_format: 0.3.0

# node information
name: AutonomousModeTransitionFlag.node

package:
  name: autoware_operation_mode_transition_manager
  provider: autoware

launch:
  plugin: autoware::operation_mode_transition_manager::AutonomousModeTransitionFlagNode
  executable: autonomous_mode_transition_flag_node
  node_output: screen

# interfaces
subscribers:
  - name: kinematics
    message_type: nav_msgs/msg/Odometry
    remap_target: kinematics
  - name: trajectory
    message_type: autoware_planning_msgs/msg/Trajectory
    remap_target: trajectory
  - name: control_cmd
    message_type: autoware_control_msgs/msg/Control
    remap_target: control_cmd
  - name: trajectory_follower_control_cmd
    message_type: autoware_control_msgs/msg/Control
    remap_target: trajectory_follower_control_cmd
  # system interfaces: node-side names are fixed
  - name: driving_mode/info
    message_type: tier4_system_msgs/msg/DrivingModeInfo
    remap_target: /system/driving_mode/info
    qos:
      reliability: reliable
      durability: transient_local

publishers:
  # system interfaces: node-side names are fixed
  - name: command_mode/transition/available
    message_type: tier4_system_msgs/msg/ModeChangeAvailable
    remap_target: /system/command_mode/transition/available
  - name: command_mode/transition/completed
    message_type: tier4_system_msgs/msg/ModeChangeAvailable
    remap_target: /system/command_mode/transition/completed
  - name: driving_mode/stable
    message_type: tier4_system_msgs/msg/DrivingModeFlag
    remap_target: /system/driving_mode/stable
  - name: diagnostics
    message_type: diagnostic_msgs/msg/DiagnosticArray
    global: /diagnostics

# parameters
param_files:
  - name: operation_mode_transition_manager_param
    default: $(find-pkg-share autoware_operation_mode_transition_manager)/config/operation_mode_transition_manager.param.yaml

param_values: []

# processes
processes:
  - name: evaluate_transition
    trigger_conditions:
      - periodic: 10.0
    outcomes:
      - to_output: command_mode/transition/available
      - to_output: command_mode/transition/completed
      - to_output: driving_mode/stable
